<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tiny Island — Tài khoản</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root { --bg:#eef7fb; --card:#fff; --text:#17323d; --muted:#567480; --accent:#1f8a70; --border:#d3e6ee; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1d24; --card:#16262f; --text:#e4f1f6; --muted:#9db8c3; --accent:#3cbf98; --border:#24404c; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:40px 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; }
  h1 { font-size:1.4rem; margin:0 0 10px; }
  label { display:block; margin:14px 0 6px; font-weight:600; }
  input { width:100%; padding:12px; font-size:1rem; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button { margin-top:16px; width:100%; padding:13px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; }
  .muted { color:var(--muted); font-size:.92rem; }
  .bad { color:var(--bad); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main><div class="card">
  <h1 id="title">Tài khoản Tiny Island</h1>
  <p id="msg" class="muted">Đang kiểm tra liên kết…</p>
  <form id="reset" hidden>
    <label for="pw">Mật khẩu mới (ít nhất 8 ký tự)</label>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" required>
    <label for="pw2">Nhập lại</label>
    <input id="pw2" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Đổi mật khẩu</button>
  </form>
</div>
<p class="muted">Trang này chỉ dùng cho email xác minh / đặt lại mật khẩu của game Tiny Island Survival. Không lưu gì trên trình duyệt.</p>
</main>
<script>
// Public client config only (publishable key; data is protected by RLS).
const SUPABASE_URL = "https://pshlpaefhlirqntorrdt.supabase.co";
const KEY = "sb_publishable_XRWkUXMyMjbP6U3m3ZzmQQ_O_7rBzMe";
const h = new URLSearchParams(location.hash.slice(1));
const q = new URLSearchParams(location.search);
const title = document.getElementById("title"), msg = document.getElementById("msg"), form = document.getElementById("reset");
history.replaceState(null, "", location.pathname);          // drop the token from the address bar
const err = h.get("error_description") || q.get("error_description");
const type = h.get("type") || q.get("type");
const token = h.get("access_token");
if (err) {
  title.textContent = "Liên kết không dùng được";
  msg.innerHTML = '<span class="bad"></span><br>Liên kết có thể đã hết hạn hoặc đã dùng. Vào game để gửi lại email.';
  msg.querySelector(".bad").textContent = err;
} else if (type === "recovery" && token) {
  title.textContent = "Đặt lại mật khẩu";
  msg.textContent = "Nhập mật khẩu mới cho tài khoản game.";
  form.hidden = false;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const a = document.getElementById("pw").value, b = document.getElementById("pw2").value;
    if (a.length < 8) { msg.textContent = "Mật khẩu cần ít nhất 8 ký tự."; return; }
    if (a !== b) { msg.textContent = "Hai mật khẩu không khớp."; return; }
    msg.textContent = "Đang đổi…";
    try {
      const r = await fetch(SUPABASE_URL + "/auth/v1/user", { method: "PUT",
        headers: { "apikey": KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ password: a }) });
      if (r.ok) { form.hidden = true; title.textContent = "Đã đổi mật khẩu ✓"; msg.textContent = "Quay lại game và đăng nhập bằng mật khẩu mới."; }
      else { const j = await r.json().catch(() => ({})); msg.textContent = "Không đổi được: " + (j.msg || j.error_description || r.status); }
    } catch (x) { msg.textContent = "Không kết nối được. Thử lại."; }
  });
} else if (token || type === "signup" || type === "email") {
  title.textContent = "Email đã được xác minh ✓";
  msg.textContent = "Quay lại game Tiny Island, vào Cài đặt › Các đảo của bạn › Đám mây và đăng nhập.";
} else {
  msg.textContent = "Mở trang này từ liên kết trong email của game.";
}
</script>
</body>
</html>
